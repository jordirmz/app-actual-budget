name: "Actual Budget"
description: "Run the latest stable version of Actual Budget"
url: "https://actualbudget.org"
slug: "actualbudget"
init: false
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
startup: application
webui: "[PROTO:option_name]://[HOST]:[PORT:5006]"
boot: auto
ports:
  5006/tcp: 5006
image: ghcr.io/actualbudget/actual
version: 26.6.0
readonly: true
host_network: false
apparmor: true
map:
  - addon_config:rw
user: "1000:1000"
